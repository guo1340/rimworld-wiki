<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Top-down RimWorld colony command map with rooms, farms, power and raid markers">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f2a23"/>
      <stop offset=".55" stop-color="#3a3027"/>
      <stop offset="1" stop-color="#171615"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <rect width="44" height="44" fill="none" stroke="#b79b68" stroke-opacity=".13" stroke-width="2"/>
      <circle cx="7" cy="7" r="2" fill="#c97b2b" opacity=".2"/>
    </pattern>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .18"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#ground)"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity=".72"/>
  <circle cx="1230" cy="126" r="76" fill="#d07a2c" opacity=".3"/>

  <path d="M0 620c230-88 400-76 578-34 218 50 410 10 610-56 168-54 285-34 412 28v342H0z" fill="#222" opacity=".74"/>
  <path d="M0 740c280-74 520-66 770-18 300 58 570 24 830-50v228H0z" fill="#141414" opacity=".9"/>

  <g transform="translate(584 286)" stroke="#b79b68" stroke-width="7">
    <rect x="0" y="0" width="358" height="286" fill="#2b2b28"/>
    <rect x="22" y="22" width="110" height="86" fill="#34332f"/>
    <rect x="154" y="22" width="82" height="86" fill="#34332f"/>
    <rect x="258" y="22" width="78" height="86" fill="#34332f"/>
    <rect x="22" y="130" width="144" height="134" fill="#34332f"/>
    <rect x="188" y="130" width="148" height="134" fill="#34332f"/>
    <path d="M22 108h314M166 130v134M132 22v86M236 22v86" stroke="#4c4a41"/>
    <rect x="62" y="56" width="32" height="28" fill="#6d9ab0" stroke="none"/>
    <rect x="204" y="162" width="74" height="42" fill="#151515" stroke="#6d9ab0"/>
    <path d="M218 178h48M218 192h36" stroke="#6d9ab0" stroke-width="5"/>
  </g>

  <g transform="translate(352 524)" stroke="#d07a2c" stroke-width="6">
    <rect x="0" y="0" width="164" height="128" fill="#282927"/>
    <path d="M0 0l82-44 82 44" fill="#34332f"/>
    <rect x="24" y="36" width="44" height="34" fill="#151515"/>
    <rect x="96" y="36" width="44" height="34" fill="#151515"/>
    <rect x="62" y="86" width="40" height="42" fill="#151515"/>
  </g>

  <g transform="translate(988 488)" stroke="#6d9ab0" stroke-width="7" fill="#191919">
    <rect x="0" y="0" width="198" height="104"/>
    <path d="M26 30h142M26 64h92"/>
    <path d="M34 104v68M164 104v68M8 172h182"/>
    <circle cx="154" cy="34" r="14" fill="#6d9ab0" opacity=".5"/>
  </g>

  <g transform="translate(1168 628)" stroke="#7f944b" stroke-width="7" fill="none" stroke-linecap="square">
    <path d="M0 104h286"/>
    <path d="M24 104V38h52v66M112 104V18h52v86M200 104V52h52v52"/>
    <path d="M30 38h40M118 18h40M206 52h40"/>
    <path d="M10 20h260" stroke="#4c4a41" opacity=".55"/>
  </g>

  <g transform="translate(218 664)">
    <path d="M0 52c42-52 98-52 140 0-42 24-98 24-140 0z" fill="#a8483c" opacity=".9"/>
    <circle cx="70" cy="46" r="13" fill="#d07a2c"/>
    <path d="M-34 94h210" stroke="#a8483c" stroke-width="7" opacity=".65"/>
  </g>

  <g font-family="monospace" font-size="25" fill="#c2a36d" opacity=".62">
    <text x="76" y="112">COLONY STATUS: SURVIVING</text>
    <text x="76" y="146">RAID INTENSITY: RISING</text>
    <text x="1052" y="124">FREEZER ONLINE</text>
    <text x="1052" y="158">MEDICAL STOCK LOW</text>
  </g>

  <g font-family="monospace" font-size="32" font-weight="700">
    <text x="528" y="682" fill="#ece6d9">@</text>
    <text x="570" y="682" fill="#d07a2c">!</text>
    <text x="612" y="682" fill="#7f944b">+</text>
    <text x="654" y="682" fill="#6d9ab0">*</text>
  </g>

  <rect width="1600" height="900" filter="url(#grain)" opacity=".52"/>
</svg>
